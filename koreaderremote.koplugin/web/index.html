<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F0F5FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1F26" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>KOReader Remote</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar" id="home-topbar">
        <button
          id="btn-manual"
          class="btn-icon"
          type="button"
          aria-label="Add manually"
          title="Add manually"
          data-i18n-attr="aria-label,title"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <div class="brand brand-center">
          <h1>KOReader Remote</h1>
        </div>
        <button
          id="btn-scan"
          class="btn-icon"
          type="button"
          aria-label="Refresh"
          title="Refresh"
          data-i18n-attr="aria-label,title"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.6-6.3" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        </button>
      </header>

      <main>
        <section id="view-home" class="view">
          <section class="section">
            <div class="section-head"><h2 data-i18n="This device">This device</h2></div>
            <p id="this-device-hint" class="hint" data-i18n="Served by the reader plugin — open to connect same-origin. No public website needed.">
              Served by the reader plugin — open to connect same-origin. No public website needed.
            </p>
            <div id="this-device-list" class="device-list"></div>
          </section>

          <section class="section">
            <div class="section-head"><h2 data-i18n="Saved">Saved</h2></div>
            <div id="favorites-list" class="device-list"></div>
            <p id="favorites-empty" class="empty" data-i18n="No other saved devices yet">No other saved devices yet</p>
          </section>

          <section class="section">
            <button id="btn-guide" class="guide-row" type="button">
              <span class="guide-icon" aria-hidden="true">?</span>
              <span class="guide-copy">
                <strong data-i18n="How to use">How to use</strong>
                <span data-i18n="Remote control from your phone's browser">Remote control from your phone's browser</span>
              </span>
              <span class="chevron">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
              </span>
            </button>
          </section>
        </section>

        <section id="view-remote" class="view hidden">
          <div class="remote-nav">
            <button id="btn-back" class="btn btn-ghost" type="button" data-i18n="Back">Back</button>
            <button id="btn-device-info" class="remote-nav-center" type="button">
              <div class="remote-title-row">
                <span id="remote-online-dot" class="online-dot" aria-hidden="true"></span>
                <h2 id="remote-title" data-i18n="Device">Device</h2>
                <svg class="nav-chevron" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
              <p id="remote-subtitle" class="remote-subtitle"></p>
            </button>
            <button
              id="btn-app-menu"
              class="btn-icon btn-icon-plain"
              type="button"
              aria-label="Settings"
              data-i18n-attr="aria-label"
            >
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
          </div>

          <div id="remote-error" class="remote-error hidden"></div>

          <div class="tts-bar glass-card glass-elevated">
            <button id="btn-tts-play" class="tts-cover" type="button" aria-label="Read aloud" data-i18n-attr="aria-label">
              <img id="tts-cover-img" class="hidden" alt="" />
              <span id="tts-cover-fallback" class="tts-cover-fallback" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M4.75 5.5A2.75 2.75 0 0 1 7.5 2.75h10.25a.75.75 0 0 1 0 1.5H7.5a1.25 1.25 0 0 0 0 2.5h10.25a.75.75 0 0 1 .75.75v12.25a2.75 2.75 0 0 1-2.75 2.75H7.5A2.75 2.75 0 0 1 4.75 19.75V5.5Zm1.5 2.75V19.75c0 .69.56 1.25 1.25 1.25h8.25c.69 0 1.25-.56 1.25-1.25V8.25H6.25Z"/></svg>
              </span>
              <span class="tts-cover-overlay">
                <svg id="tts-play-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5.5v13l11-6.5L8 5.5Z"/></svg>
              </span>
            </button>
            <div class="tts-meta">
              <strong id="tts-title" data-i18n="Read aloud">Read aloud</strong>
              <span id="tts-subtitle" class="muted" data-i18n="Tap to start reading this page aloud">Tap to start reading this page aloud</span>
            </div>
            <button
              id="btn-tts-settings"
              class="circle-btn"
              type="button"
              aria-label="Read-aloud settings"
              data-i18n-attr="aria-label"
              disabled
            >
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M14 7a2 2 0 1 0 4 0 2 2 0 0 0-4 0ZM4 17h6M10 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0ZM20 17h-6M20 7h-2"/></svg>
            </button>
            <button
              id="btn-tts-stop"
              class="circle-btn circle-danger hidden"
              type="button"
              aria-label="Stop reading aloud"
              data-i18n-attr="aria-label"
            >
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>

          <div id="bottom-bar-wrap" class="bottom-bar-wrap">
            <div id="bottom-bar" class="bottom-bar glass-card glass-elevated"></div>
            <div id="bottom-bar-tip" class="bottom-bar-tip hidden" data-i18n="Long-press a button to edit the bottom bar">Long-press a button to edit the bottom bar</div>
          </div>

          <div id="page-pad" class="page-pad layout-vertical">
            <button id="btn-prev" class="page-btn" type="button">
              <span class="page-btn-icon" data-dir="prev" aria-hidden="true"></span>
              <span data-i18n="Previous page">Previous page</span>
            </button>
            <button id="btn-next" class="page-btn" type="button">
              <span class="page-btn-icon" data-dir="next" aria-hidden="true"></span>
              <span data-i18n="Next page">Next page</span>
            </button>
          </div>

          <p id="remote-status" class="remote-status" data-i18n="Ready">Ready</p>
        </section>
      </main>
    </div>

    <div id="sheet-root" class="sheet-root hidden" aria-hidden="true">
      <div class="sheet-backdrop" data-close-sheet></div>
      <div class="sheet" role="dialog" aria-modal="true">
        <div class="sheet-header">
          <button type="button" class="btn btn-ghost" data-close-sheet data-i18n="Close">Close</button>
          <h3 id="sheet-title" data-i18n="Panel">Panel</h3>
          <span class="sheet-header-spacer"></span>
        </div>
        <div id="sheet-body" class="sheet-body"></div>
      </div>
    </div>

    <div id="menu-root" class="menu-root hidden" aria-hidden="true">
      <div class="sheet-backdrop" data-close-menu></div>
      <div class="action-menu" role="menu">
        <button type="button" data-menu="layout" data-i18n="Switch page turn layout">Switch page turn layout</button>
        <button type="button" data-menu="edit-bar" data-i18n="Edit bottom bar">Edit bottom bar</button>
        <button type="button" data-menu="haptic" data-i18n="Page turn haptics">Page turn haptics</button>
        <button type="button" data-menu="appearance" data-i18n="Appearance">Appearance</button>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
